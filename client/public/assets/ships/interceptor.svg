<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="hull" x1="40" y1="5" x2="40" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cockpit" x1="40" y1="20" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Wings -->
  <polygon points="40,8 68,62 56,66 40,48 24,66 12,62" fill="url(#hull)" stroke="#0ea5e9" stroke-width="1.5"/>
  <!-- Wingtip cannons -->
  <rect x="10" y="44" width="4" height="20" rx="2" fill="#38bdf8"/>
  <rect x="66" y="44" width="4" height="20" rx="2" fill="#38bdf8"/>
  <!-- Center Fuselage -->
  <polygon points="40,6 48,52 40,64 32,52" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Cockpit glass -->
  <ellipse cx="40" cy="30" rx="5" ry="10" fill="url(#cockpit)"/>
  <!-- Thrusters -->
  <polygon points="36,64 40,76 44,64" fill="#38bdf8"/>
  <circle cx="40" cy="74" r="3" fill="#ffffff"/>
</svg>
